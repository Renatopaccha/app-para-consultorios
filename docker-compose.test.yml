services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zenda_test
      POSTGRES_USER: zenda_test
      POSTGRES_PASSWORD: zenda_test
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zenda_test -d zenda_test']
      interval: 2s
      timeout: 3s
      retries: 20
